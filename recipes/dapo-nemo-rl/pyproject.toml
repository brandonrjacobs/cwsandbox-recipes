[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dapo-nemo-rl"
version = "0.1.0"
description = "DAPO RL on Qwen2.5-Math-7B: NeMo-RL on SUNK, rollouts from CoreWeave Dedicated Inference, NeMo-Gym in CoreWeave sandboxes."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
# The host only launches the run. NeMo-RL and NeMo-Gym are installed on SUNK and in the
# Gym sandbox. cwtrain manages the inference gateway and deployment.
dependencies = [
    "cwsandbox==1.19.0",
    "cwtrain==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dapo_nemo_rl"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
