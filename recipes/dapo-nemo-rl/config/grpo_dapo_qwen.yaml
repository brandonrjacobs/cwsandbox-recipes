# DAPO on Qwen2.5-Math-7B with NeMo-RL v0.7.0. Training uses the 8 GPUs of one SUNK node;
# rollouts come from NeMo-Gym and a CoreWeave Dedicated Inference deployment, which receives
# new weights by hot-load. Evaluation is AIME-2024, graded in CoreWeave sandboxes.
# Settings not listed here come from the base config.
defaults: "/opt/nemo-rl/examples/configs/grpo_math_1B.yaml"

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  max_num_steps: 20
  use_leave_one_out_baseline: false
  # DAPO dynamic sampling: keep only prompts whose answers got different rewards.
  use_dynamic_sampling: true
  batch_multiplier: 2
  dynamic_sampling_max_gen_batches: 10
  # Map the 0/1 math-verify score to -1/+1.
  reward_scaling:
    enabled: true
    source_min: 0.0
    source_max: 1.0
    target_min: -1.0
    target_max: 1.0
  # DAPO overlong penalty for answers near the length limit.
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    overlong_buffer_penalty: 1
    max_response_length: ${policy.generation.max_new_tokens}
  # Evaluation on AIME-2024 every val_period steps and at the end.
  max_val_samples: null  # set by NeMo-RL to the eval set size
  val_period: 10
  val_at_start: false
  val_at_end: true

loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28  # DAPO clip-higher
  token_level_loss: true
  use_importance_sampling_correction: false

checkpointing:
  enabled: false

policy:
  model_name: "/work/models/base"  # downloaded at start
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 128  # num_prompts_per_step x num_generations_per_prompt
  train_micro_batch_size: 1
  logprob_batch_size: 2
  max_total_sequence_length: 3072
  precision: "bfloat16"
  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
  sequence_packing:
    enabled: false
  megatron_cfg:
    enabled: false
  worker_extension_cls_fqn: "dapo_nemo_rl.nemo_rl_ext.worker.ExportDTensorPolicyWorker"
  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1.0e-6
      weight_decay: 0.1
      betas: [0.9, 0.999]
      eps: 1e-8
  generation:
    backend: "coreweave_hotload"
    max_new_tokens: 2048
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    colocated:
      enabled: false
      # GPUs of the deployment (2 replicas x 1 GPU); used only for throughput metrics.
      resources:
        gpus_per_node: 2
        num_nodes: 1
    # Set by run_trainer from the deployment that the launcher created.
    hotload_cfg:
      base_url: ${oc.env:INFERENCE_BASE_URL}  # https://<gateway>/v1
      model: ${oc.env:INFERENCE_MODEL}
      deployment_id: ${oc.env:HOTLOAD_DEPLOYMENT_ID}
      bucket: ${oc.env:HOTLOAD_BUCKET}
      path_prefix: ${oc.env:HOTLOAD_PATH_PREFIX}
      run_id: ${oc.env:DAPO_RUN_TAG}  # hot-load identities are <run_id>-v000001, ...
      token_env: COREWEAVE_API_TOKEN
      max_model_len: ${policy.max_total_sequence_length}

data:
  max_input_seq_length: null
  shuffle: true
  train:
    dataset_name: NemoGymDataset
    data_path: "/work/data/train.jsonl"
  validation:
    dataset_name: NemoGymDataset
    data_path: "/work/data/eval.jsonl"
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    processor: "nemo_gym_data_processor"
    prompt_file: null
    system_prompt_file: null

env:
  should_use_nemo_gym: true
  nemo_gym:
    # The Gym sandbox's agents, local on this node through the Tailcat tunnel. Rows name their agent.
    remote_agent_urls:
      math_with_judge_simple_agent: ${oc.env:GYM_TRAIN_AGENT_URL}
      math_eval_agent: ${oc.env:GYM_EVAL_AGENT_URL}
    remote_concurrency: 256

logger:
  log_dir: "/work/logs"
  wandb_enabled: false  # run_trainer enables it when WANDB_API_KEY is set
  tensorboard_enabled: false
  monitor_gpus: false
  wandb:
    project: ${oc.env:WANDB_PROJECT,dapo-nemo-rl}
    name: ${oc.env:EXPERIMENT_NAME,qwen2.5-math-7b-dapo}

cluster:
  gpus_per_node: 8
  num_nodes: 1
